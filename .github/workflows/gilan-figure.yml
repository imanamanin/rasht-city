name: Fetch Gilan figure

on:
  schedule:
    # Weekly — Sundays ~07:30 Tehran-ish (04:00 UTC)
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-figure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Discover Gilan-born figures
        run: node scripts/fetch-gilan-figure.mjs --count 5

      - name: Commit if data changed
        run: |
          if git diff --quiet -- assets/data/gilan-figures.json assets/data/gilan-figures-log.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/gilan-figures.json assets/data/gilan-figures-log.json
          git commit -m "Add weekly Gilan memorial figure from Wikipedia/Wikidata."
          git push
